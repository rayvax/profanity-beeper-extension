<!doctype html>
<html lang="ru">
  <head>
    <meta charset="UTF-8" />
    <title>Youtube Beeper</title>
    <style>
      body {
        font-family: system-ui, sans-serif;
        margin: 0;
        padding: 12px 14px;
        min-width: 340px;
        font-size: 13px;
      }
      p {
        margin: 0 0 10px;
      }
      label {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
      }
      .hint {
        margin-top: 10px;
        font-size: 11px;
        color: #555;
        line-height: 1.4;
      }
      #ml-debug {
        margin-top: 12px;
        border-top: 1px solid #ddd;
        padding-top: 10px;
      }
      #ml-debug h2 {
        margin: 0 0 6px;
        font-size: 12px;
      }
      #ml-transcript {
        max-height: 150px;
        overflow-y: auto;
        padding: 8px;
        border-radius: 6px;
        background: #f3f3f3;
        line-height: 1.7;
      }
      #ml-transcript span {
        display: inline-block;
        margin-right: 5px;
      }
      #ml-transcript .partial {
        color: #666;
        font-style: italic;
      }
      #ml-transcript .censored {
        border-radius: 3px;
        padding: 0 3px;
        background: #b3261e;
        color: #fff;
        font-weight: 700;
      }
      #ml-debug .legend {
        margin: 0 0 6px;
        color: #666;
        font-size: 11px;
      }
    </style>
  </head>
  <body>
    <form id="settings">
      <label
        >Источник
        <select name="source">
          <option value="captions">Субтитры</option>
          <option value="ml">ML</option>
        </select></label
      >
      <label
        >Эффект
        <select name="effect">
          <option value="beep">Сигнал</option>
          <option value="silence">Тишина</option>
        </select></label
      >
      <label
        >Задержка <input name="delaySeconds" type="range" min="0.6" max="3" step="0.1" /><output
          id="delay"
        ></output
      ></label>
      <label>Дополнительные слова <textarea name="literalAdditions" rows="3"></textarea></label>
      <label>RegExp (по одному на строку) <textarea name="patterns" rows="3"></textarea></label>
      <label>Whitelist <textarea name="whitelist" rows="3"></textarea></label>
      <p id="status"></p>
      <p id="error" role="alert"></p>
    </form>
    <section id="ml-debug" hidden>
      <h2>Распознавание ML</h2>
      <p class="legend">Серым — предварительно, красным — цензурируется</p>
      <div id="ml-transcript" aria-live="polite">
        <span data-empty>Ожидание распознавания…</span>
      </div>
    </section>
    <script type="module" src="../lib/popup-ui.ts"></script>
  </body>
</html>
